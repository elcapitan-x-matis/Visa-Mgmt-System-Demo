<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Permit Profile | Work VISA Management System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">Records</li>
                    <li class="breadcrumb-item"><a href="permits.html">Permits</a></li>
                    <li class="breadcrumb-item active" id="breadcrumbNo">...</li>
                </ol>

                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 id="permitTitle">Loading...</h2>
                    <div>
                        <a href="#" id="editPermitBtn" class="btn btn-sm btn-outline-primary me-2">
                            Edit Permit&nbsp;<i class="bi-pencil-square"></i>
                        </a>
                        <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-toggle="modal" data-bs-target="#deletePermitModal">
                            Delete Permit&nbsp;<i class="bi-trash"></i>
                        </button>
                    </div>
                </div>
                <hr>

                <div class="row">
                    <!-- LEFT COLUMN: Permit Details -->
                    <div class="col-lg-7 col-md-12 mb-4" id="permitDetailsSection">
                        <!-- Injected via JS -->
                    </div>

                    <!-- RIGHT COLUMN: Linked Client Info -->
                    <div class="col-lg-5 col-md-12 mb-4" id="clientInfoSection">
                        <!-- Injected via JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/data-loader.js"></script>
    <script src="assets/js/auth.js"></script>

    <script>
        let currentPermitNo = null;

        document.addEventListener("DOMContentLoaded", async () => {
            await includeHTML("nav-placeholder", "partials/nav.html");
            await includeHTML("footer-placeholder", "partials/footer.html");

            const session = checkAuth();
            if (!session) return;

            const data = await loadAppData();
            if (!data) return;

            const urlParams = new URLSearchParams(window.location.search);
            currentPermitNo = parseInt(urlParams.get('no'));

            if (!currentPermitNo) {
                window.location.href = '404.html';
                return;
            }

            const permit = data.permits.find(p => p.permitNo === currentPermitNo);
            if (!permit) {
                window.location.href = '404.html';
                return;
            }

            const client = data.clients.find(c => c.clientID === permit.clientID);
            const type = data.permit_types.find(t => t.typeCode === permit.permitType);

            // Set Headers
            document.getElementById('breadcrumbNo').textContent = permit.permitNo;
            document.getElementById('permitTitle').textContent = `Permit #${permit.permitNo}`;
            document.getElementById('editPermitBtn').href = `permit-edit.html?no=${permit.permitNo}`;

            // Render Permit Details (Left Column)
            let permitHtml = `
            <div class="card h-100">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="bi-file-earmark-text"></i>&nbsp;Permit Information</h5>
                </div>
                <div class="card-body p-0">
                    <div class="table-responsive">
                        <table class="table table-sm table-borderless mb-0">
                            <tbody>
                                <tr><th class="w-50 ps-3">Permit Number</th><td class="pe-3"><strong>#${permit.permitNo}</strong></td></tr>
                                <tr><th class="ps-3">Permit Type</th><td class="pe-3">${type ? type.name : 'Unknown'}</td></tr>
                                <tr><th class="ps-3">Status</th><td class="pe-3"><span class="fs-6">${getStatusBadge(permit.status)}</span></td></tr>
                                <tr><th class="ps-3">Date Issued</th><td class="pe-3">${dateToText(permit.dateIssued)}</td></tr>
                                <tr><th class="ps-3">Expiry Date</th><td class="pe-3">${dateToText(permit.dateExpiry)}</td></tr>
                                <tr><th class="ps-3">Last Updated</th><td class="pe-3">${datetimeToText(permit.updatedOn)}</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>`;
            document.getElementById('permitDetailsSection').innerHTML = permitHtml;

            // Render Linked Client (Right Column)
            let clientHtml = `
            <div class="card border-start border-4 border-primary h-100">
                <div class="card-header bg-white">
                    <h5 class="mb-0"><i class="bi-person-circle"></i>&nbsp;Assigned Client</h5>
                </div>
                <div class="card-body">`;

            if (client) {
                clientHtml += `
                    <div class="text-center mb-3">
                        <i class="bi-person-circle text-primary" style="font-size: 3rem;"></i>
                        <h4 class="mt-2 mb-1">${client.firstname} ${client.lastname}</h4>
                        <p class="text-muted small">${client.occupation || 'N/A'}</p>
                    </div>
                    <ul class="list-group list-group-flush mb-3">
                        <li class="list-group-item px-0"><strong><i class="bi-globe"></i> Country:</strong> ${client.country}</li>
                        ${client.phone ? `<li class="list-group-item px-0"><strong><i class="bi-telephone"></i> Phone:</strong> ${client.phone}</li>` : ''}
                        ${client.email ? `<li class="list-group-item px-0"><strong><i class="bi-envelope"></i> Email:</strong> ${client.email}</li>` : ''}
                    </ul>
                    <a href="client-view.html?id=${client.clientID}" class="btn btn-block btn-primary w-100">
                        View Full Client Profile&nbsp;<i class="bi-box-arrow-up-right"></i>
                    </a>`;
            } else {
                clientHtml += `
                    <div class="text-center text-muted p-4">
                        <i class="bi-exclamation-circle fs-1"></i>
                        <p class="mt-2">The client associated with this permit could not be found.</p>
                    </div>`;
            }
            clientHtml += `</div></div>`;
            document.getElementById('clientInfoSection').innerHTML = clientHtml;
        });

        async function deletePermit() {
            const confirmed = await confirmAction(
                'Delete Permit', 
                'You are about to delete this permit record. This action cannot be undone.', 
                'Yes, delete it'
            );
            if (!confirmed) return;

            const data = window.APP_DATA;
            data.permits = data.permits.filter(p => p.permitNo !== currentPermitNo);
            saveAppData();
            window.location.href = 'permits.html';
        }
    </script>
</body>
</html>
