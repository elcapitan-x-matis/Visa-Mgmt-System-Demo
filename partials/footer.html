<footer id="footer">
	<div class="container">
		<div class="row justify-content-center text-center">
			<div class="col-md-6 mb-3">
				<p class="text-muted mb-0">
					PNG Immigration and Citizenship Authority &amp;<br>
					Department of Labor and Industrial Relations
				</p>
			</div>
			<div class="col-md-6">
				<p class="text-muted mb-0">
					Work VISA Database Management System &copy; <span id="footerYear"></span>
				</p>
			</div>
		</div>
	</div>
</footer>

<!-- Scroll to Top Button -->
<button onclick="topFunction()" id="scroll-btn" class="btn btn-primary shadow" style="display: none; position: fixed; bottom: 20px; right: 30px; z-index: 99;">
	<i class="bi-arrow-up-circle fs-5"></i>
</button>

<script>
    // Set Footer Year
    document.getElementById('footerYear').textContent = new Date().getFullYear();

    // Scroll to Top Logic
    const scrollBtn = document.getElementById("scroll-btn");
    
    window.onscroll = function() {
        if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
            scrollBtn.style.display = "block";
        } else {
            scrollBtn.style.display = "none";
        }
    };

    function topFunction() {
        document.body.scrollTop = 0; // For Safari
        document.documentElement.scrollTop = 0; // For Chrome, Firefox, IE and Opera
    }
</script>
