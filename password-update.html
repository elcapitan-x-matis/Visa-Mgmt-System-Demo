<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password | Work VISA Management System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/custom.css">
<link rel="icon" href="assets/icon/favicon.ico" type="image/x-icon">
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">User Account</li>
                    <li class="breadcrumb-item">Password Authentication</li>
                    <li class="breadcrumb-item active" id="breadcrumbUsername">...</li>
                </ol>
                <h3>Change Password</h3>
                <hr>

                <div class="col-lg-8 col-md-10 col-sm-12">
                    <form id="passwordForm" onsubmit="handleUpdatePassword(event)">
                        <div class="form-group text-right mb-3">
                            <i class="bi-asterisk required"></i>&nbsp;Required fields
                        </div>

                        <div class="form-group mb-3">
                            <label for="curPass">Current Password&nbsp;<i class="bi-asterisk required"></i></label>
                            <input type="password" class="form-control form-control-sm" id="curPass" required>
                        </div>

                        <div class="form-group mb-3">
                            <label for="newPass">New Password&nbsp;<i class="bi-asterisk required"></i></label>
                            <input type="password" class="form-control form-control-sm" id="newPass" required minlength="4">
                        </div>

                        <div class="form-group mb-3">
                            <label for="confirmPass">Confirm New Password&nbsp;<i class="bi-asterisk required"></i></label>
                            <input type="password" class="form-control form-control-sm" id="confirmPass" required minlength="4">
                        </div>

                        <hr>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <button type="submit" class="btn btn-block btn-sm btn-primary">Save Changes&nbsp;<i class="bi-save"></i></button>
                            </div>
                            <div class="col-md-6">
                                <a href="dashboard.html" class="btn btn-block btn-sm btn-outline-secondary">Cancel&nbsp;<i class="bi-x-circle"></i></a>
                            </div>
                        </div>
                    </form>
                    <p class="alertMessage" id="formMsg"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/data-loader.js"></script>
    <script src="assets/js/auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await includeHTML("nav-placeholder", "partials/nav.html");
            await includeHTML("footer-placeholder", "partials/footer.html");

            const session = checkAuth();
            if (!session) return;

            document.getElementById('breadcrumbUsername').textContent = session.username;
        });

        function handleUpdatePassword(event) {
            event.preventDefault();
            const session = checkAuth();
            if (!session) return;

            const curPass = document.getElementById('curPass').value;
            const newPass = document.getElementById('newPass').value;
            const confirmPass = document.getElementById('confirmPass').value;
            const msg = document.getElementById('formMsg');
            msg.textContent = '';

            // For the demo, current password check is just 'password'
            if (curPass !== 'password') {
                msg.textContent = "Your current password entered is wrong!";
                return;
            }

            if (newPass !== confirmPass) {
                msg.textContent = "Your passwords do not match! Try again...";
                return;
            }

            const data = window.APP_DATA;
            const index = data.users.findIndex(u => u.userID === session.userID);
            if (index !== -1) {
                data.users[index].password = newPass; // In real life, SHA1 hash here
                saveAppData();
                alert("Your password has been updated!");
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
