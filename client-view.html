<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Profile | Work VISA Management System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">Records</li>
                    <li class="breadcrumb-item"><a href="clients.html">Clients</a></li>
                    <li class="breadcrumb-item active" id="breadcrumbId">...</li>
                </ol>
                
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 id="clientName">Loading...</h2>
                    <a href="#" id="editClientBtn" class="btn btn-sm btn-outline-primary">
                        Edit Client&nbsp;<i class="bi-pencil-square"></i>
                    </a>
                </div>
                <hr>

                <div class="row">
                    <!-- Left Column: Client Info & Permit -->
                    <div class="col-md-8" id="clientDetails">
                        <!-- Injected via JS -->
                    </div>

                    <!-- Right Column: Notes -->
                    <div class="col-md-4" id="clientNotesSection">
                        <!-- Injected via JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/data-loader.js"></script>
    <script src="assets/js/auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await includeHTML("nav-placeholder", "partials/nav.html");
            await includeHTML("footer-placeholder", "partials/footer.html");

            const session = checkAuth();
            if (!session) return;

            const data = await loadAppData();
            if (!data) return;

            const urlParams = new URLSearchParams(window.location.search);
            const clientId = parseInt(urlParams.get('id'));

            if (!clientId) {
                window.location.href = '404.html';
                return;
            }

            const client = data.clients.find(c => c.clientID === clientId);
            if (!client) {
                window.location.href = '404.html';
                return;
            }

            // Set Headers
            document.getElementById('breadcrumbId').textContent = client.clientID;
            document.getElementById('clientName').textContent = `${client.lastname}, ${client.firstname}`;
            document.getElementById('editClientBtn').href = `client-edit.html?id=${client.clientID}`;

            // Find Establishment
            const est = data.establishments.find(e => e.ID === client.establishmentID);
            const estName = est ? est.name : 'Unknown Establishment';
            const estLink = est ? `establishment-view.html?id=${est.ID}` : '#';

            // Build Client Details HTML
            let detailsHtml = `
            <div class="table-responsive mb-4">
                <table class="table table-sm table-borderless">
                    <thead>
                        <tr><th colspan="2"><i class="bi-info-circle"></i>&nbsp;Personal Information</th></tr>
                    </thead>
                    <tbody>
                        <tr><th>Full Name</th><td>${client.firstname} ${client.othername || ''} ${client.lastname}</td></tr>
                        <tr><th>Country of Origin</th><td>${client.country}</td></tr>
                        <tr><th>Occupation</th><td>${client.occupation || 'N/A'}</td></tr>
                        <tr><th>Phone/Mobile</th><td>${client.phone || 'N/A'}</td></tr>
                        <tr><th>Email</th><td>${client.email || 'N/A'}</td></tr>
                        <tr><th>Establishment</th><td><a href="${estLink}">${estName}</a></td></tr>
                    </tbody>
                </table>
            </div>`;

            // Find Permit
            const permit = data.permits.find(p => p.clientID === client.clientID);
            if (permit) {
                const pType = data.permit_types.find(t => t.typeCode === permit.permitType);
                detailsHtml += `
                <div class="table-responsive">
                    <table class="table table-sm table-borderless">
                        <thead>
                            <tr><th colspan="2"><i class="bi-file-earmark-text"></i>&nbsp;Work Permit Information</th></tr>
                        </thead>
                        <tbody>
                            <tr><th>Permit No.</th><td><a href="permit-view.html?no=${permit.permitNo}">${permit.permitNo}</a></td></tr>
                            <tr><th>Permit Type</th><td>${pType ? pType.name : 'Unknown'}</td></tr>
                            <tr><th>Status</th><td>${getStatusBadge(permit.status)}</td></tr>
                            <tr><th>Date Issued</th><td>${dateToText(permit.dateIssued)}</td></tr>
                            <tr><th>Expiry Date</th><td>${dateToText(permit.dateExpiry)}</td></tr>
                        </tbody>
                    </table>
                </div>`;
            } else {
                detailsHtml += `
                <a href="permit-select-client.html" class="btn btn-sm btn-block btn-primary">
                    Add New Permit&nbsp;<i class="bi-plus-circle"></i>
                </a>`;
            }
            document.getElementById('clientDetails').innerHTML = detailsHtml;

            // Build Notes Section
            const notes = data.client_notes.filter(n => n.clientID === client.clientID);
            let notesHtml = `
            <button type="button" class="btn btn-sm btn-primary float-end" data-bs-toggle="modal" data-bs-target="#newNoteModal">
                New&nbsp;<i class="bi-pencil"></i>
            </button>
            <p class="mb-4"><strong><i class="bi-files"></i>&nbsp;Notes</strong></p>
            <ul class="list-unstyled">`;

            if (notes.length === 0) {
                notesHtml += `<p class="text-muted small">No notes available.</p>`;
            } else {
                notes.forEach(note => {
                    notesHtml += `
                    <li class="mb-3 pb-3 border-bottom">
                        <p class="mb-2">${note.notes}</p>
                        <button type="button" class="btn btn-sm btn-outline-primary py-0 px-2" onclick="deleteNote(${note.ID})">Remove&nbsp;<i class="bi-trash"></i></button>
                    </li>`;
                });
            }
            notesHtml += `</ul>`;
            document.getElementById('clientNotesSection').innerHTML = notesHtml;

            // Add Note Modal (appended to body to prevent z-index issues)
            const modalHtml = `
            <div class="modal fade" id="newNoteModal" tabindex="-1" aria-hidden="true">
                <div class="modal-dialog modal-dialog-centered">
                    <div class="modal-content">
                        <div class="modal-header">
                            <h5 class="modal-title">Add New Note</h5>
                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                        </div>
                        <form id="addNoteForm" onsubmit="addNote(event, ${client.clientID})">
                            <div class="modal-body">
                                <textarea class="form-control form-control-sm" rows="5" id="noteText" placeholder="Enter note..." required></textarea>
                            </div>
                            <div class="modal-footer">
                                <button type="submit" class="btn btn-sm btn-primary">Save Note&nbsp;<i class="bi-save"></i></button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>`;
            document.body.insertAdjacentHTML('beforeend', modalHtml);
        });

        // Note CRUD Functions
        function addNote(event, clientId) {
            event.preventDefault();
            const text = document.getElementById('noteText').value;
            if (!text.trim()) return;

            const data = window.APP_DATA;
            const newId = Math.max(...data.client_notes.map(n => n.ID), 0) + 1;
            
            data.client_notes.push({
                ID: newId,
                notes: text,
                clientID: clientId,
                createdOn: new Date().toISOString()
            });

            saveAppData();
            window.location.reload(); // Quick refresh to show new note
        }

        function deleteNote(noteId) {
            if (!confirm('Are you sure you want to remove this note?')) return;
            
            const data = window.APP_DATA;
            data.client_notes = data.client_notes.filter(n => n.ID !== noteId);
            
            saveAppData();
            window.location.reload();
        }
    </script>
</body>
</html>
