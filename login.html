<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log In | Work VISA Management System</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>

    <div class="container-fluid" style="min-height: 100vh; display: flex; align-items: center; justify-content: center;">
        <div class="row justify-content-center w-100">
            <div class="col-12 text-center mb-4">
                <h1 class="text-primary">PNG Immigration & Citizenship Authority<br>
                    &amp;<br>
                    The Department of Labour & Industrial Relations
                </h1>
            </div>
            
            <div class="col-lg-4 col-md-6 col-sm-8 col-xs-12 text-center">
                <img src="assets/images/seal.png" class="img-fluid mb-4" style="max-width: 250px;" alt="PNG Seal">
                
                <h3 class="display-6 mb-4" style="color: #A80000;">Log In</h3>
                
                <form id="loginForm" onsubmit="handleLogin(event)" style="padding: 20px 10px; background: white; border-radius: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.05);">
                    
                    <div class="form-group mb-3">
                        <input type="text" id="username" name="username" class="form-control form-control-sm" placeholder="enter username...">
                    </div>   
                    
                    <div class="form-group mb-3">
                        <input type="password" id="password" name="password" class="form-control form-control-sm" placeholder="enter password...">
                    </div>
                    
                    <div class="form-group">
                        <button type="submit" class="btn btn-sm btn-block btn-primary w-100 py-2">
                            Go&nbsp;<i class="bi-box-arrow-in-right"></i>
                        </button>
                    </div>
                </form>
                
                <small class="text-muted d-block mt-3">
                    Work VISA Database Management System | <span id="currentYear"></span>
                </small>
                
                <!-- AJAX Alert Message Target -->
                <p id="loginAlertMessage" class="alertMessage mt-3 fw-bold"></p>
                
                <!-- Demo Credentials Hint -->
                <div class="mt-4 p-3 bg-light border text-start small text-muted">
                    <strong><i class="bi-info-circle"></i> Demo Credentials:</strong><br>
                    Username: <code>rnongkas</code> (Admin)<br>
                    Password: <code>password</code>
                </div>
            </div>
        </div>
    </div> 

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/data-loader.js"></script>
    <script src="assets/js/auth.js"></script>
    
    <script>
        // Set current year
        document.getElementById('currentYear').textContent = new Date().getFullYear();
    </script>
</body>
</html>
