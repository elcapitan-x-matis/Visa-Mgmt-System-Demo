<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Accounts | Work VISA Management System</title>
    
    <!-- CDNs -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.0.0/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item active">Users</li>
                </ol>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2>All Accounts</h2>
                    <a href="user-add.html" class="btn btn-sm btn-primary">
                        <i class="bi-person-plus"></i>&nbsp;Add New User
                    </a>
                </div>
                <hr>

                <div class="table-responsive">
                    <table class="table table-sm table-hover" id="userTable" width="100%" cellspacing="0">
                        <thead class="bg-light text-center">
                            <tr>
                                <th colspan="3" class="text-start"></th>
                                <th colspan="5">Permissions Access</th>
                            </tr>
                            <tr>
                                <th>ID</th>
                                <th class="text-start">Name</th>
                                <th>Status</th>
                                <th>Client Forms</th>
                                <th>Est Forms</th>
                                <th>Sub-Est Forms</th>
                                <th>Permit Forms</th>
                                <th>User Forms</th>
                            </tr>
                        </thead>
                        <tfoot class="bg-light text-center">
                            <tr>
                                <th colspan="3" class="text-start"></th>
                                <th colspan="5">Permissions Access</th>
                            </tr>
                            <tr>
                                <th>ID</th>
                                <th class="text-start">Name</th>
                                <th>Status</th>
                                <th>Client Forms</th>
                                <th>Est Forms</th>
                                <th>Sub-Est Forms</th>
                                <th>Permit Forms</th>
                                <th>User Forms</th>
                            </tr>
                        </tfoot>
                        <tbody id="userTableBody" class="text-center">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net@2.0.8/js/dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.0.0/js/dataTables.bootstrap5.min.js"></script>
    
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/data-loader.js"></script>
    <script src="assets/js/auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await includeHTML("nav-placeholder", "partials/nav.html");
            await includeHTML("footer-placeholder", "partials/footer.html");

            const session = checkAuth();
            if (!session) return;

            const data = await loadAppData();
            if (!data) return;

            const tbody = document.getElementById('userTableBody');
            let html = '';
            let modalsHtml = '';

            // Only show users other than the currently logged-in user
            data.users.forEach(user => {
                if (user.userID === session.userID) return;

                const role = data.roles.find(r => r.ID === user.roleID);
                const roleName = role ? role.role : 'Unknown';

                html += `
                <tr>
                    <td>${user.userID}</td>
                    <td class="text-start">
                        <a href="#" data-bs-toggle="modal" data-bs-target="#userModal${user.userID}">
                            <i class="bi-person"></i>&nbsp;${user.firstname} ${user.lastname}
                        </a>
                    </td>
                    <td>${getActivationBadge(user.activation)}</td>
                    <td>${permissionsBadge(user.crud_client)}</td>
                    <td>${permissionsBadge(user.crud_est)}</td>
                    <td>${permissionsBadge(user.crud_sub_est)}</td>
                    <td>${permissionsBadge(user.crud_permit)}</td>
                    <td>${permissionsBadge(user.crud_user)}</td>
                </tr>`;

                // Build User Detail Modal
                modalsHtml += `
                <div class="modal fade" id="userModal${user.userID}" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered modal-lg">
                        <div class="modal-content text-start">
                            <div class="modal-header">
                                <h5 class="modal-title"><i class="bi-person"></i>&nbsp;${user.firstname} ${user.lastname}</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <div class="row">
                                    <div class="col-md-6">
                                        <p><i class="bi-info-circle"></i>&nbsp;Details</p>
                                        <ul class="list-unstyled">
                                            <li><strong>Username: </strong>${user.username}</li>
                                            <li><strong>Email: </strong>${user.email || 'N/A'}</li>
                                            <li><strong>Role: </strong>${roleName}</li>
                                        </ul>
                                        
                                        <a href="user-edit.html?id=${user.userID}" class="btn btn-sm btn-outline-primary mb-2 w-100">
                                            Edit Access Privileges&nbsp;<i class="bi-pencil-square"></i>
                                        </a>
                                        <button data-bs-toggle="modal" data-bs-target="#removeUser${user.userID}" type="button" class="btn btn-sm btn-outline-secondary mb-4 w-100">
                                            Delete Account&nbsp;<i class="bi-trash"></i>
                                        </button>
                                        
                                        ${user.activation == 1 
                                            ? `<button onclick="toggleActivation(${user.userID}, 0)" class="btn btn-sm btn-secondary w-100">De-Activate Account&nbsp;<i class="bi-x-circle"></i></button>`
                                            : `<button onclick="toggleActivation(${user.userID}, 1)" class="btn btn-sm btn-primary w-100">Activate Account&nbsp;<i class="bi-check2-circle"></i></button>`
                                        }
                                    </div>
                                    <div class="col-md-6">
                                        <p><i class="bi-shield"></i>&nbsp;Permissions</p>
                                        <ul class="list-unstyled">
                                            <li class="mb-1">Access to client forms: ${permissionsBadge(user.crud_client)}</li>
                                            <li class="mb-1">Access to establishment forms: ${permissionsBadge(user.crud_est)}</li>
                                            <li class="mb-1">Access to sub-establishment forms: ${permissionsBadge(user.crud_sub_est)}</li>
                                            <li class="mb-1">Access to permit forms: ${permissionsBadge(user.crud_permit)}</li>
                                            <li class="mb-1">Access to user account forms: ${permissionsBadge(user.crud_user)}</li>
                                        </ul>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="modal fade" id="removeUser${user.userID}" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-dialog-centered modal-sm">
                        <div class="modal-content text-center">
                            <div class="modal-header">
                                <h5 class="modal-title">Are you sure?</h5>
                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                            </div>
                            <div class="modal-body">
                                <p class="text-muted small">Deleting this account is permanent.</p>
                                <button type="button" class="btn btn-sm btn-primary btn-block w-100 mb-2" onclick="deleteUser(${user.userID})">Discard&nbsp;<i class="bi-trash"></i></button>
                                <button type="button" data-bs-dismiss="modal" class="btn btn-sm btn-outline-secondary btn-block w-100">Cancel&nbsp;<i class="bi-save"></i></button>
                            </div>
                        </div>
                    </div>
                </div>`;
            });

            tbody.innerHTML = html;
            document.body.insertAdjacentHTML('beforeend', modalsHtml);

            // Initialize DataTable
            $('#userTable').DataTable({
                "order": [[0, "asc"]],
                "pageLength": 10,
                "language": {
                    "search": "Search users:",
                    "lengthMenu": "Show _MENU_ entries"
                }
            });
        });

        // Helper functions
        async function deleteUser(userId) {
            const confirmed = await confirmAction('Delete Account', 'Deleting this account is permanent.', 'Yes, delete account');
            if (!confirmed) return;

            const data = window.APP_DATA;
            data.users = data.users.filter(u => u.userID !== userId);
            saveAppData();
            window.location.reload();
        }

        async function toggleActivation(userId, status) {
            const action = status === 1 ? 'Activate' : 'De-Activate';
            const confirmed = await confirmAction(`${action} Account`, `Are you sure you want to ${action.toLowerCase()} this account?`, `Yes, ${action.toLowerCase()}`);
            if (!confirmed) return;

            const data = window.APP_DATA;
            const user = data.users.find(u => u.userID === userId);
            if (user) {
                user.activation = status;
                saveAppData();
                window.location.reload();
            }
        }
    </script>
</body>
</html>
