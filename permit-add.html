<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Permit | Work VISA Management System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">Records</li>
                    <li class="breadcrumb-item"><a href="permits.html">Permits</a></li>
                    <li class="breadcrumb-item active">Add New Record</li>
                </ol>
                <h3>New Permit Record</h3>
                
                <!-- Show who the permit is for -->
                <div class="alert alert-info border-0 shadow-sm d-flex align-items-center mt-3" style="background-color: rgba(0, 96, 198, 0.1); color: #0060C6;">
                    <i class="bi-person-circle fs-3 me-3"></i>
                    <div>
                        <strong>Issuing Permit For:</strong><br>
                        <span id="clientInfoText">Loading...</span>
                    </div>
                </div>
                <hr>

                <div class="col-lg-8 col-md-10 col-sm-12">
                    <form id="permitForm" onsubmit="handleAddPermit(event)">
                        <input type="hidden" id="clientId" value="">
                        
                        <div class="form-group text-right mb-3">
                            <i class="bi-asterisk required"></i>&nbsp;Required fields
                        </div>

                        <div class="form-group mb-3">
                            <label for="permitNo">New Permit Number&nbsp;<i class="bi-asterisk required"></i></label>
                            <input type="number" min="0" class="form-control form-control-sm" id="permitNo" required>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="status">Status&nbsp;<i class="bi-asterisk required"></i></label>
                                <select id="status" class="form-select form-select-sm" required>
                                    <option value="">-- Select a status --</option>
                                    <option value="Active">Active</option>
                                    <option value="Expired">Expired</option>
                                    <option value="Cancelled">Cancelled</option>
                                    <option value="Under Renewal">Under Renewal</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="type">Type of Permit&nbsp;<i class="bi-asterisk required"></i></label>
                                <select id="type" class="form-select form-select-sm" required>
                                    <option value="">-- Select a type --</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="dateIssued">Issue Date&nbsp;<i class="bi-asterisk required"></i></label>
                                <input type="date" class="form-control form-control-sm" id="dateIssued" required>
                            </div>
                            <div class="col-md-6">
                                <label for="dateExpiry">Expiry Date&nbsp;<i class="bi-asterisk required"></i></label>
                                <input type="date" class="form-control form-control-sm" id="dateExpiry" required>
                            </div>
                        </div>

                        <hr>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <button type="submit" class="btn btn-block btn-sm btn-primary">Add Record&nbsp;<i class="bi-plus-circle"></i></button>
                            </div>
                            <div class="col-md-6">
                                <a href="permit-select-client.html" class="btn btn-block btn-sm btn-outline-secondary">Cancel&nbsp;<i class="bi-x-circle"></i></a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/data-loader.js"></script>
    <script src="assets/js/auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await includeHTML("nav-placeholder", "partials/nav.html");
            await includeHTML("footer-placeholder", "partials/footer.html");

            const session = checkAuth();
            if (!session) return;

            const data = await loadAppData();
            if (!data) return;

            const urlParams = new URLSearchParams(window.location.search);
            const clientId = parseInt(urlParams.get('clientId'));

            if (!clientId) {
                window.location.href = 'permit-select-client.html';
                return;
            }

            const client = data.clients.find(c => c.clientID === clientId);
            if (!client) {
                window.location.href = '404.html';
                return;
            }

            // Populate Client Info Banner
            document.getElementById('clientInfoText').innerHTML = `<strong>${client.firstname} ${client.lastname}</strong> (ID: ${client.clientID})`;
            document.getElementById('clientId').value = client.clientID;

            // Populate Permit Types Dropdown
            const typeSelect = document.getElementById('type');
            data.permit_types.forEach(t => {
                typeSelect.innerHTML += `<option value="${t.typeCode}">${t.name}</option>`;
            });

            // Set Default Date
            document.getElementById('dateIssued').value = new Date().toISOString().split('T')[0];
        });

        function handleAddPermit(event) {
            event.preventDefault();
            const data = window.APP_DATA;
            
            const newPermitNo = parseInt(document.getElementById('permitNo').value);
            if (data.permits.some(p => p.permitNo === newPermitNo)) {
                showAlert('Error', 'Permit number already exists!', 'error');
                return;
            }

            const newPermit = {
                permitNo: newPermitNo,
                permitType: document.getElementById('type').value,
                status: document.getElementById('status').value,
                dateIssued: document.getElementById('dateIssued').value,
                dateExpiry: document.getElementById('dateExpiry').value,
                clientID: parseInt(document.getElementById('clientId').value),
                updatedOn: new Date().toISOString().slice(0, 19).replace('T', ' ')
            };

            data.permits.push(newPermit);
            saveAppData();

            window.location.href = `permit-view.html?no=${newPermit.permitNo}`;
        }
    </script>
</body>
</html>
