<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update My Account | Work VISA Management System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">User Account</li>
                    <li class="breadcrumb-item">Profile Details</li>
                    <li class="breadcrumb-item active" id="breadcrumbUsername">...</li>
                </ol>
                <h3>Update My Account</h3>
                <hr>

                <div class="col-lg-8 col-md-10 col-sm-12">
                    <form id="profileForm" onsubmit="handleUpdateProfile(event)">
                        <div class="form-group text-right mb-3">
                            <i class="bi-asterisk required"></i>&nbsp;Required fields
                        </div>

                        <div class="row mb-3">
                            <div class="col-sm-6">
                                <label for="firstname">First name&nbsp;<i class="bi-asterisk required"></i></label>
                                <input type="text" class="form-control form-control-sm" id="firstname" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="lastname">Last name&nbsp;<i class="bi-asterisk required"></i></label>
                                <input type="text" class="form-control form-control-sm" id="lastname" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-sm-6">
                                <label for="username">Username&nbsp;<i class="bi-asterisk required"></i></label>
                                <input type="text" class="form-control form-control-sm" id="username" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="email">Email</label>
                                <input type="email" class="form-control form-control-sm" id="email">
                            </div>
                        </div>

                        <hr>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <button type="submit" class="btn btn-block btn-sm btn-primary">Save Changes&nbsp;<i class="bi-save"></i></button>
                            </div>
                            <div class="col-md-6">
                                <a href="dashboard.html" class="btn btn-block btn-sm btn-outline-secondary">Cancel&nbsp;<i class="bi-x-circle"></i></a>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/data-loader.js"></script>
    <script src="assets/js/auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await includeHTML("nav-placeholder", "partials/nav.html");
            await includeHTML("footer-placeholder", "partials/footer.html");

            const session = checkAuth();
            if (!session) return;

            const data = await loadAppData();
            if (!data) return;

            const user = data.users.find(u => u.userID === session.userID);
            if (!user) return;

            document.getElementById('breadcrumbUsername').textContent = user.username;
            document.getElementById('firstname').value = user.firstname;
            document.getElementById('lastname').value = user.lastname;
            document.getElementById('username').value = user.username;
            document.getElementById('email').value = user.email || '';
        });

        function handleUpdateProfile(event) {
            event.preventDefault();
            const session = checkAuth();
            if (!session) return;

            const data = window.APP_DATA;
            const index = data.users.findIndex(u => u.userID === session.userID);
            if (index === -1) return;

            data.users[index].firstname = document.getElementById('firstname').value.trim();
            data.users[index].lastname = document.getElementById('lastname').value.trim();
            data.users[index].username = document.getElementById('username').value.trim();
            data.users[index].email = document.getElementById('email').value.trim() || null;

            // Update session
            session.name = `${data.users[index].firstname} ${data.users[index].lastname}`;
            session.username = data.users[index].username;
            session.email = data.users[index].email;
            localStorage.setItem('workvisa_session', JSON.stringify(session));

            saveAppData();
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
