<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Client | Work VISA Management System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/custom.css">
<link rel="icon" href="assets/icon/favicon.ico" type="image/x-icon">
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">Records</li>
                    <li class="breadcrumb-item"><a href="clients.html">Clients</a></li>
                    <li class="breadcrumb-item active">Update Record</li>
                </ol>
                <h3>Update Client Record</h3>
                <hr>

                <div class="col-lg-8 col-md-10 col-sm-12">
                    <form id="clientForm" onsubmit="handleUpdateClient(event)">
                        <input type="hidden" id="clientId" value="">
                        
                        <div class="form-group text-right mb-3">
                            <i class="bi-asterisk required"></i>&nbsp;Required fields
                        </div>

                        <h5>Client Details</h5>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="firstname">First Name&nbsp;<i class="bi-asterisk required"></i></label>
                                <input type="text" class="form-control form-control-sm" id="firstname" required>
                            </div>
                            <div class="col-md-4">
                                <label for="othername">Other/Middle Name</label>
                                <input type="text" class="form-control form-control-sm" id="othername">
                            </div>
                            <div class="col-md-4">
                                <label for="lastname">Last Name&nbsp;<i class="bi-asterisk required"></i></label>
                                <input type="text" class="form-control form-control-sm" id="lastname" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="country">Country of Origin&nbsp;<i class="bi-asterisk required"></i></label>
                                <input type="text" class="form-control form-control-sm" id="country" required>
                            </div>
                            <div class="col-md-6">
                                <label for="occupation">Occupation in PNG&nbsp;<i class="bi-asterisk required"></i></label>
                                <input type="text" class="form-control form-control-sm" id="occupation" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="phone">Phone</label>
                                <input type="number" class="form-control form-control-sm" id="phone" min="0">
                            </div>
                            <div class="col-md-6">
                                <label for="email">Email</label>
                                <input type="email" class="form-control form-control-sm" id="email">
                            </div>
                        </div>

                        <h5 class="mt-4">Establishment Details</h5>
                        <div class="form-group mb-3">
                            <label for="est">Under Establishment&nbsp;<i class="bi-asterisk required"></i></label>
                            <select class="form-select form-select-sm" id="est" required>
                                <option value="">-- Select an establishment --</option>
                            </select>
                        </div>

                        <hr>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <button type="submit" class="btn btn-block btn-sm btn-primary">Save Changes&nbsp;<i class="bi-save"></i></button>
                            </div>
                            <div class="col-md-6">
                                <a href="#" id="cancelBtn" class="btn btn-block btn-sm btn-outline-secondary">Cancel&nbsp;<i class="bi-x-circle"></i></a>
                            </div>
                        </div>
                    </form>
                    <p class="alertMessage" id="formMsg"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/data-loader.js"></script>
    <script src="assets/js/auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await includeHTML("nav-placeholder", "partials/nav.html");
            await includeHTML("footer-placeholder", "partials/footer.html");

            const session = checkAuth();
            if (!session) return;

            const data = await loadAppData();
            if (!data) return;

            const urlParams = new URLSearchParams(window.location.search);
            const clientId = parseInt(urlParams.get('id'));

            const client = data.clients.find(c => c.clientID === clientId);
            if (!client) {
                window.location.href = '404.html';
                return;
            }

            // Populate Establishments Dropdown
            const estSelect = document.getElementById('est');
            data.establishments.forEach(e => {
                const selected = (e.ID === client.establishmentID) ? 'selected' : '';
                estSelect.innerHTML += `<option value="${e.ID}" ${selected}>${e.name}</option>`;
            });

            // Populate Form Fields
            document.getElementById('clientId').value = client.clientID;
            document.getElementById('firstname').value = client.firstname;
            document.getElementById('lastname').value = client.lastname;
            document.getElementById('othername').value = client.othername || '';
            document.getElementById('country').value = client.country;
            document.getElementById('occupation').value = client.occupation;
            document.getElementById('phone').value = client.phone || '';
            document.getElementById('email').value = client.email || '';

            document.getElementById('cancelBtn').href = `client-view.html?id=${client.clientID}`;
        });

        function handleUpdateClient(event) {
            event.preventDefault();
            const data = window.APP_DATA;
            const clientId = parseInt(document.getElementById('clientId').value);

            const index = data.clients.findIndex(c => c.clientID === clientId);
            if (index === -1) return;

            // Update record
            data.clients[index] = {
                ...data.clients[index],
                firstname: document.getElementById('firstname').value.trim(),
                lastname: document.getElementById('lastname').value.trim().toUpperCase(),
                othername: document.getElementById('othername').value.trim() || null,
                country: document.getElementById('country').value.trim(),
                occupation: document.getElementById('occupation').value.trim(),
                establishmentID: parseInt(document.getElementById('est').value),
                phone: document.getElementById('phone').value.trim() || null,
                email: document.getElementById('email').value.trim() || null
            };

            saveAppData();
            window.location.href = `client-view.html?id=${clientId}`;
        }
    </script>
</body>
</html>
