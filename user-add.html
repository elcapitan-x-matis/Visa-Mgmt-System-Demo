<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New User | Work VISA Management System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">Users</li>
                    <li class="breadcrumb-item"><a href="users.html">Accounts</a></li>
                    <li class="breadcrumb-item active">Add New User</li>
                </ol>
                <h3>New User Account</h3>
                <hr>

                <div class="col-lg-8 col-md-10 col-sm-12">
                    <form id="userForm" onsubmit="handleAddUser(event)">
                        <div class="form-group text-right mb-3">
                            <i class="bi-asterisk required"></i>&nbsp;Required fields
                        </div>

                        <div class="row mb-3">
                            <div class="col-sm-6">
                                <label for="firstname">First name&nbsp;<i class="bi-asterisk required"></i></label>
                                <input type="text" class="form-control form-control-sm" id="firstname" required>
                            </div>
                            <div class="col-sm-6">
                                <label for="lastname">Last name&nbsp;<i class="bi-asterisk required"></i></label>
                                <input type="text" class="form-control form-control-sm" id="lastname" required>
                            </div>
                        </div>

                        <div class="form-group mb-3">
                            <label for="email">Email</label>
                            <input type="email" class="form-control form-control-sm" id="email">
                        </div>

                        <div class="row mb-3">
                            <div class="col-sm-6">
                                <label for="password1">New Password&nbsp;<i class="bi-asterisk required"></i></label>
                                <input type="password" class="form-control form-control-sm" id="password1" required minlength="4">
                            </div>
                            <div class="col-sm-6">
                                <label for="password2">Re-enter Password&nbsp;<i class="bi-asterisk required"></i></label>
                                <input type="password" class="form-control form-control-sm" id="password2" required minlength="4">
                            </div>
                        </div>

                        <div class="form-group mb-3">
                            <label for="role">User Role&nbsp;<i class="bi-asterisk required"></i></label>
                            <select class="form-select form-select-sm" id="role" required>
                                <option value="">-- Select an user role --</option>
                            </select>
                        </div>

                        <hr>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <button type="submit" class="btn btn-block btn-sm btn-primary">Add User&nbsp;<i class="bi-plus-circle"></i></button>
                            </div>
                            <div class="col-md-6">
                                <a href="users.html" class="btn btn-block btn-sm btn-outline-secondary">Cancel&nbsp;<i class="bi-x-circle"></i></a>
                            </div>
                        </div>
                    </form>
                    <p class="alertMessage" id="formMsg"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/data-loader.js"></script>
    <script src="assets/js/auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await includeHTML("nav-placeholder", "partials/nav.html");
            await includeHTML("footer-placeholder", "partials/footer.html");

            const session = checkAuth();
            if (!session) return;

            const data = await loadAppData();
            if (!data) return;

            const roleSelect = document.getElementById('role');
            data.roles.forEach(r => {
                roleSelect.innerHTML += `<option value="${r.ID}">${r.role}</option>`;
            });
        });

        function handleAddUser(event) {
            event.preventDefault();
            const data = window.APP_DATA;

            const p1 = document.getElementById('password1').value;
            const p2 = document.getElementById('password2').value;

            if (p1 !== p2) {
                document.getElementById('formMsg').textContent = "Passwords do not match!";
                return;
            }

            const newId = Math.max(...data.users.map(u => u.userID), 0) + 1;
            const fname = document.getElementById('firstname').value.trim();
            const lname = document.getElementById('lastname').value.trim();
            const username = (fname.charAt(0) + lname).toLowerCase();

            const newUser = {
                userID: newId,
                firstname: fname,
                lastname: lname,
                username: username,
                email: document.getElementById('email').value.trim() || null,
                password: p1, // In a real app, this would be SHA1
                roleID: parseInt(document.getElementById('role').value),
                activation: 1,
                crud_client: 0, crud_est: 0, crud_sub_est: 0, crud_permit: 0, crud_user: 0
            };

            data.users.push(newUser);
            saveAppData();

            window.location.href = 'users.html';
        }
    </script>
</body>
</html>
