<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Records | Work VISA Management System</title>
    
    <!-- CDNs -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/custom.css">
<link rel="icon" href="assets/icon/favicon.ico" type="image/x-icon">
</head>
<body>

    <!-- Inject Navbar -->
    <div id="nav-placeholder"></div>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item active">Records</li>
                </ol>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2>Clients & Permits</h2>
                    <a href="client-add.html" class="btn btn-sm btn-primary">
                        <i class="bi-person-plus"></i>&nbsp;Add New Client
                    </a>
                </div>
                <hr>
                
                <div class="row" id="clientsContainer">
                    <!-- Client Cards injected here via JS -->
                    <div class="col-12 text-center py-5">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2 text-muted">Loading client records...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Inject Footer -->
    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/data-loader.js"></script>
    <script src="assets/js/auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await includeHTML("nav-placeholder", "partials/nav.html");
            await includeHTML("footer-placeholder", "partials/footer.html");

            const session = checkAuth();
            if (!session) return;

            const data = await loadAppData();
            if (!data) return;

            const container = document.getElementById('clientsContainer');
            let html = '';

            if (data.clients.length === 0) {
                container.innerHTML = '<div class="col-12"><p class="text-muted">No clients found.</p></div>';
                return;
            }

            // Render client cards (mirrors inc/client-card.php)
            data.clients.forEach(client => {
                // Find associated permit
                const permit = data.permits.find(p => p.clientID === client.clientID);
                
                let permitHtml = '';
                if (permit) {
                    permitHtml = `<i class="bi-file-earmark-text"></i>&nbsp;${permit.permitNo}`;
                } else {
                    permitHtml = `<span class="badge bg-warning pill-rounded text-dark">No Work Permit Assigned</span>`;
                }

                html += `
                <div class="col-lg-4 col-md-6 col-sm-12 mb-3">
                    <div class="card h-100">
                        <div class="card-header pb-0 border-0">
                            <h5>
                                <a href="client-view.html?id=${client.clientID}">
                                    #${client.clientID}
                                </a>
                            </h5>
                        </div>
                        <div class="card-body pt-2">
                            <p class="text-muted mb-0">
                                <i class="bi-person"></i>&nbsp;${client.lastname}, ${client.firstname} ${client.othername || ''}
                                <br>
                                ${permitHtml}
                            </p>
                        </div>
                    </div>
                </div>`;
            });

            container.innerHTML = html;
        });
    </script>
</body>
</html>
