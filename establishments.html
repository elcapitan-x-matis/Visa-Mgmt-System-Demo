<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Establishment Records | Work VISA Management System</title>
    
    <!-- CDNs -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.0.0/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/custom.css">
    <link rel="icon" href="assets/icon/favicon.ico" type="image/x-icon">
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item active">Records</li>
                </ol>
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2>Establishments</h2>
                    <a href="establishment-add.html" class="btn btn-sm btn-primary">
                        <i class="bi-plus-circle"></i>&nbsp;Add New Establishment
                    </a>
                </div>
                <hr>

                <div class="table-responsive">
                    <table class="table table-sm table-hover" id="estTable" width="100%" cellspacing="0">
                        <thead class="bg-light">
                            <tr>
                                <th>Name of Establishment</th>
                                <th>Place of Operation</th>
                                <th>Other Sub-Companies</th>
                            </tr>
                        </thead>
                        <tfoot class="bg-light">
                            <tr>
                                <th>Name of Establishment</th>
                                <th>Place of Operation</th>
                                <th>Other Sub-Companies</th>
                            </tr>
                        </tfoot>
                        <tbody id="estTableBody">
                            <!-- Injected via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net@2.0.8/js/dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/datatables.net-bs5@1.0.0/js/dataTables.bootstrap5.min.js"></script>
    
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/data-loader.js"></script>
    <script src="assets/js/auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            // 1. Inject Layout
            await includeHTML("nav-placeholder", "partials/nav.html");
            await includeHTML("footer-placeholder", "partials/footer.html");

            // 2. Auth Check
            const session = checkAuth();
            if (!session) return;

            // 3. Load Data
            const data = await loadAppData();
            if (!data) {
                alert("Failed to load database. Check console.");
                return;
            }

            const tbody = document.getElementById('estTableBody');
            let html = '';

            // 4. SAFE FALLBACK: Ensure the array exists before filtering
            const subEstablishments = data.sub_establishments || [];

            data.establishments.forEach(est => {
                // Find sub-establishments safely
                const subests = subEstablishments.filter(s => s.establishmentID === est.ID);
                let subestHtml = '<ul class="list-unstyled mb-0">';
                
                if (subests.length > 0) {
                    subests.forEach(sub => {
                        subestHtml += `
                        <li>
                            <a href="subestablishment-view.html?id=${sub.ID}">
                                <i class="bi-chevron-bar-right"></i>&nbsp;${sub.name}
                            </a>
                        </li>`;
                    });
                } else {
                    subestHtml += '<li class="text-muted small">None</li>';
                }
                subestHtml += '</ul>';

                html += `
                <tr>
                    <td><a href="establishment-view.html?id=${est.ID}">${est.name}</a></td>
                    <td>${est.placeOfOperation}</td>
                    <td>${subestHtml}</td>
                </tr>`;
            });

            tbody.innerHTML = html;

            // 5. Initialize DataTable safely
            if ($.fn.DataTable) {
                $('#estTable').DataTable({
                    "order": [[0, "asc"]],
                    "pageLength": 10,
                    "language": {
                        "search": "Filter records:",
                        "lengthMenu": "Show _MENU_ entries"
                    }
                });
            } else {
                console.error("DataTables library not loaded properly.");
            }
        });
    </script>
</body>
</html>
