<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Work VISA Management System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/custom.css">
    
    <style>
        .error-container {
            min-height: 70vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-title {
            font-size: 8rem;
            font-weight: bold;
            color: #0060C6;
            line-height: 1;
            text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12">
                <div class="error-container">
                    <div class="card text-center shadow-lg border-0" style="max-width: 600px; width: 100%;">
                        <div class="card-body p-5">
                            <h1 class="error-title">404</h1>
                            <p class="text-muted lead mt-3">
                                Oops! Something went wrong...<br>
                                This page or file does not exist or is missing.
                            </p>
                            <hr class="my-4">
                            <a href="dashboard.html" class="btn btn-primary w-100 py-2">
                                <i class="bi-box-arrow-left"></i>&nbsp;Back to Dashboard
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/data-loader.js"></script>
    <script src="assets/js/auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await includeHTML("nav-placeholder", "partials/nav.html");
            await includeHTML("footer-placeholder", "partials/footer.html");
            // No auth check here, so users see the 404 even if logged out
        });
    </script>
</body>
</html>
