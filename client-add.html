<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Client | Work VISA Management System</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/custom.css">
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="container-fluid">
        <div class="row justify-content-center">
            <div class="col-12">
                <ol class="breadcrumb">
                    <li class="breadcrumb-item">Records</li>
                    <li class="breadcrumb-item"><a href="clients.html">Clients</a></li>
                    <li class="breadcrumb-item active">Add New Record</li>
                </ol>
                <h3>New Client Record</h3>
                <hr>

                <div class="col-lg-8 col-md-10 col-sm-12">
                    <form id="clientForm" onsubmit="handleAddClient(event)">
                        <div class="form-group text-right mb-3">
                            <i class="bi-asterisk required"></i>&nbsp;Required fields
                        </div>

                        <h5>Client Details</h5>
                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label for="firstname">First Name&nbsp;<i class="bi-asterisk required"></i></label>
                                <input type="text" class="form-control form-control-sm" id="firstname" required>
                            </div>
                            <div class="col-md-4">
                                <label for="othername">Other/Middle Name</label>
                                <input type="text" class="form-control form-control-sm" id="othername">
                            </div>
                            <div class="col-md-4">
                                <label for="lastname">Last Name&nbsp;<i class="bi-asterisk required"></i></label>
                                <input type="text" class="form-control form-control-sm" id="lastname" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="country">Country of Origin&nbsp;<i class="bi-asterisk required"></i></label>
                                <input type="text" class="form-control form-control-sm" id="country" required>
                            </div>
                            <div class="col-md-6">
                                <label for="occupation">Occupation in PNG&nbsp;<i class="bi-asterisk required"></i></label>
                                <input type="text" class="form-control form-control-sm" id="occupation" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="phone">Phone</label>
                                <input type="number" class="form-control form-control-sm" id="phone" min="0">
                            </div>
                            <div class="col-md-6">
                                <label for="email">Email</label>
                                <input type="email" class="form-control form-control-sm" id="email">
                            </div>
                        </div>

                        <h5 class="mt-4">Establishment Details</h5>
                        <div class="form-group mb-3">
                            <label for="est">Under Establishment&nbsp;<i class="bi-asterisk required"></i></label>
                            <select class="form-select form-select-sm" id="est" required>
                                <option value="">-- Select an establishment --</option>
                            </select>
                        </div>

                        <hr>
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <button type="submit" class="btn btn-block btn-sm btn-primary">Add Record&nbsp;<i class="bi-plus-circle"></i></button>
                            </div>
                            <div class="col-md-6">
                                <a href="clients.html" class="btn btn-block btn-sm btn-outline-secondary">Cancel&nbsp;<i class="bi-x-circle"></i></a>
                            </div>
                        </div>
                    </form>
                    <p class="alertMessage" id="formMsg"></p>
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>

    <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="assets/js/utils.js"></script>
    <script src="assets/js/data-loader.js"></script>
    <script src="assets/js/auth.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            await includeHTML("nav-placeholder", "partials/nav.html");
            await includeHTML("footer-placeholder", "partials/footer.html");

            const session = checkAuth();
            if (!session) return;

            const data = await loadAppData();
            if (!data) return;

            const estSelect = document.getElementById('est');
            data.establishments.forEach(e => {
                estSelect.innerHTML += `<option value="${e.ID}">${e.name}</option>`;
            });
        });

        function handleAddClient(event) {
            event.preventDefault();
            const data = window.APP_DATA;

            // Get new ID (highest existing + 1)
            const newId = Math.max(...data.clients.map(c => c.clientID), 20000) + 1;

            const newClient = {
                clientID: newId,
                firstname: document.getElementById('firstname').value.trim(),
                lastname: document.getElementById('lastname').value.trim().toUpperCase(),
                othername: document.getElementById('othername').value.trim() || null,
                country: document.getElementById('country').value.trim(),
                occupation: document.getElementById('occupation').value.trim(),
                establishmentID: parseInt(document.getElementById('est').value),
                phone: document.getElementById('phone').value.trim() || null,
                email: document.getElementById('email').value.trim() || null
            };

            data.clients.push(newClient);
            saveAppData();

            window.location.href = 'clients.html';
        }
    </script>
</body>
</html>
